<!DOCTYPE html>
<html lang="en" data-theme="clio-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D4C55" />
    <meta name="description" content="Clio - Your Smart Journal, Notes & Reminders" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
    <link rel="mask-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" color="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Clio - Your Smart Journal, Notes & Reminders</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Listen for messages from service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', event => {
          if (event.data.type === 'COMPLETE_REMINDER') {
            // Dispatch event to the main app
            window.dispatchEvent(new CustomEvent('complete-reminder', {
              detail: { reminderId: event.data.reminderId }
            }));
          } else if (event.data.type === 'SNOOZE_REMINDER') {
            // Dispatch event to the main app
            window.dispatchEvent(new CustomEvent('snooze-reminder', {
              detail: { reminderId: event.data.reminderId }
            }));
          }
        });
      }
    </script>
  </body>
</html>
