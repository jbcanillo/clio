server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API (and the streaming CopilotKit endpoint) is proxied to the backend container.
  location /api/ {
    proxy_pass http://clio-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 6m;
  }

  location = /health {
    proxy_pass http://clio-api:4000/health;
  }

  # Service workers must never be cached by the browser.
  location ~ ^/(sw\.js|service-worker\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
