# Clio stack. NEVER run `docker compose down -v`: it deletes the vault and data volumes.
services:
  clio-web:
    build:
      context: ./frontend
      args:
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "${PORT:-4356}:80"
    depends_on:
      - clio-api
    restart: unless-stopped

  clio-api:
    build: ./backend
    env_file:
      - path: ./.env
        required: false
    environment:
      - API_PORT=4000
      - VAULT_DIR=/vault
      - DATA_DIR=/data
    volumes:
      - vault:/vault
      - data:/data
    # The AI library logs failed requests (including your messages); keep that log small.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    restart: unless-stopped

  # Optional: start with `docker compose --profile memory up -d` and set MEMORY_BACKEND=basic-memory.
  # Needs outbound access to huggingface.co on first run (embedding model download).
  basic-memory:
    profiles: ["memory"]
    build: ./basic-memory
    volumes:
      - vault:/vault
      - bm-config:/config
    restart: unless-stopped

volumes:
  vault:
  data:
  bm-config:
