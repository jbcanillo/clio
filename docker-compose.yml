# Clio stack. NEVER run `docker compose down -v`: it deletes the vault and data volumes.
services:
  clio-web:
    build:
      context: ./frontend
      args:
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "${PORT:-4356}:80"
    depends_on:
      - clio-api
    restart: unless-stopped

  clio-api:
    build: ./backend
    env_file:
      - path: ./.env
        required: false
    environment:
      - API_PORT=4000
      - VAULT_DIR=/vault
      - DATA_DIR=/data
    volumes:
      - vault:/vault
      - data:/data
    restart: unless-stopped

volumes:
  vault:
  data:
